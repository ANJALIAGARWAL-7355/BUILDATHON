services:
  - type: web
    name: buildathon-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 4 -b 0.0.0.0:$PORT app.main:app --timeout 120"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        value: "sqlite:///./razorgrowth.db"
      - key: USE_MOCK_PAYMENTS
        value: "true"
      - key: AI_PROVIDER
        value: "mock"
